should_fire:
  - 'review this pull request for OWASP Top 10 security vulnerabilities'
  - 'audit our file upload handler for path traversal and arbitrary execution'
  - 'check our API endpoints for Broken Object Level Authorization (BOLA)'
  - 'is this custom hashing implementation vulnerable to timing attacks'
  - 'review our CORS configuration and CSRF protection mechanisms'
  - 'audit our session management logic for token hijacking risks'
  - 'check our database query construction for SQL injection vectors'
  - 'review this OAuth callback handler for open redirect vulnerabilities'
should_not_fire:
  - prompt: 'audit our AWS IAM policies for overly permissive wildcard permissions'
    expect: 'cloud-security'
  - prompt: 'conduct simulated penetration tests against our staging domain'
    expect: 'pen-test'
  - prompt: 'audit npm dependencies for known CVEs'
    expect: 'dependency-audit'
