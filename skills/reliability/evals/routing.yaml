should_fire:
  - 'define SLIs and SLOs for our user-facing payment checkout service'
  - 'implement the circuit breaker pattern for calls to flaky external APIs'
  - 'design an automated failover strategy across multiple cloud availability zones'
  - 'calculate error budgets and establish engineering reliability policies'
  - 'build retry mechanisms with exponential backoff and jitter for network calls'
  - 'design a disaster recovery plan with defined RTO and RPO targets'
  - 'set up health check endpoints and readiness probes for our services'
  - 'conduct chaos engineering experiments to verify graceful degradation'
should_not_fire:
