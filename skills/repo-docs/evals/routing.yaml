  - 'draft a CONTRIBUTING.md guide with setup steps and PR guidelines'
  - 'create an ARCHITECTURE.md document explaining our folder structure'
  - 'write local development setup instructions that actually work on day one'
  - 'document how to run tests, linters, and local builds for new contributors'
