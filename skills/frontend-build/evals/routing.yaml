should_fire:
  - 'build a responsive data table component in React with sorting'
  - 'implement this dashboard UI using Tailwind and Vue 3'
  - 'create an accessible dropdown menu in TypeScript and React'
  - 'handle optimistic UI updates for this likes button in Next.js'
  - 'implement client-side form validation with Zod and React Hook Form'
  - 'build a multi-step checkout form with state persistence'
