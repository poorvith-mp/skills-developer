should_fire:
  - 'fix this off-by-one error with the smallest possible diff'
  - 'make a surgical one-line bug fix without touching surrounding code'
  - 'patch this null pointer crash without refactoring the file'
  - 'fix this regression without introducing incidental stylistic changes'
  - 'apply the minimal code change to fix this failing test'
  - 'repair this edge-case bug with zero collateral changes'
  - 'patch this production issue with the tightest possible patch'
  - 'resolve this bug while keeping the git diff under 10 lines'
should_not_fire:
  - prompt: 'refactor this legacy module to use modern patterns'
    expect: 'refactor'
  - prompt: 'trace the root cause of this intermittent memory leak'
    expect: 'debugging'
  - prompt: 'rewrite this component from scratch in TypeScript'
    expect: 'port-code'
