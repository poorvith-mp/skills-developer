should_fire:
  - 'implement HMAC signature verification for incoming Stripe webhooks'
  - 'build a reliable webhook delivery system with exponential retries and backoff'
  - 'handle idempotency keys to prevent processing duplicate webhook events'
  - 'design outgoing webhook payload schemas and developer documentation'
  - 'set up dead-letter queues for undeliverable webhook notifications'
  - 'debug why our webhook consumer drops events during traffic bursts'
  - 'handle webhook replay attacks using timestamp verification headers'
  - 'test webhook delivery locally using ngrok or mock payloads'
should_not_fire:
